        input,
        textarea {

        }

            border-color: #14b8a6;
            box-shadow: 0 0 10px rgba(20, 184, 166, 0.5);

        }

    <section class="min-h-screen flex items-center justify-center px-6 py-20">
        <div class="max-w-3xl w-full fade-in">
            <div class="glow-border">
                <div class="glow-inner">
                    <h2 class="text-3xl font-bold text-teal-400 mb-6 text-center animate-pulse">Get in Touch</h2>
                    <form id="contact-form" onsubmit="sendEmail(event)" class="space-y-6">
                        <div>
                            <label class="block text-gray-300 mb-1" for="name">Name</label>
                            <input type="text" id="name" placeholder="Your Name"
                                class="w-full p-3 rounded-lg text-white" required />
                        </div>
                        <div>
                            <label class="block text-gray-300 mb-1" for="email">Email</label>
                            <input type="email" id="email" placeholder="Your Email"
                                class="w-full p-3 rounded-lg text-white" required />
                        </div>
                        <div>
                            <label class="block text-gray-300 mb-1" for="message">Message</label>
                            <textarea id="message" rows="4" placeholder="Your Message"
                                class="w-full p-3 rounded-lg text-white resize-none" required></textarea>
                        </div>
                        <button type="submit"
                            class="w-full bg-teal-500 hover:bg-teal-400 text-white font-semibold py-3 rounded-lg transition duration-300">
                            Send Message <i class="fas fa-paper-plane ml-2"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

                        <i class="fab fa-linkedin animate-pulse"></i>
                    </a>
                    <a href="https://github.com/Tarunkumar292" target="_blank"
                        class="text-gray-300 hover:text-teal-400 text-xl transition-transform transform hover:scale-125 duration-300">

            <!-- Quick Links -->
            <div

                    Links</h4>
               <ul class="space-y-2">

                    </li>
                    <li><a href="projects.html" class="text-white-400 hover:text-teal-300 transition duration-300">Projects</a></li>

                </ul>
            </div>

            <!-- Contact Info -->
            <div
                class="reveal hover:bg-gray-800 rounded-xl p-4 transition-all duration-500 hover:shadow-lg hover:-translate-y-1">
                <h4 class="text-lg font-semibold text-white mb-4 transition duration-300 hover:text-teal-300">Contact
                    Info</h4>
                <p class="flex items-center mb-2 transition-all duration-300 hover:text-teal-300">
                    <i class="fas fa-map-marker-alt mr-2 text-blue-400"></i>
                    Sector14, Gurugram
                </p>
                <p class="flex items-center mb-2 transition-all duration-300 hover:text-teal-300">
                    <i class="fas fa-phone-alt mr-2 text-blue-400"></i>
                    <a href="tel:+8059150536" class="hover:text-teal-400">8059150536</a>

                    <a href="mailto:tarunkumar2920@gmail.com" class="hover:text-teal-400">

        </div>

        <!-- Footer bottom -->
        <div class="text-center text-gray-500 text-sm mt-10 reveal hover:text-teal-300 transition duration-500">

    <script>
        function sendEmail(event) {
            event.preventDefault();
            console.log("Form submitted");

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const message = document.getElementById("message").value.trim();

            if (!name || !email || !message) {
                alert("Please fill in all fields.");
                return;
            }

            console.log("Sending email with data:", { name, email, message });

            emailjs.send("service_t5snl8u", "template_o4vmw2n", {
                Name: name,
                Email: email,
                Message: message
            })
                .then(() => {
                    alert("Message sent successfully!");
                    document.getElementById("contact-form").reset();
                }, (error) => {
                    console.error("Email failed:", error);
                    alert("Failed to send message. Try again.");
                });
        }

    </script>
    <script src="./assets/js/script.js"></script>
